{% extends "base.html" %}
{% block content %}
<div class="card">
  <h3>Report a bug</h3>
  <form method="post" action="/add">
    <input name="title" placeholder="Bug title" required maxlength="120"><br>
    <textarea name="description" placeholder="Description" rows="2" cols="40"></textarea><br>
    <select name="severity">
      {% for s in severities %}<option {{ 'selected' if s == 'Medium' }}>{{ s }}</option>{% endfor %}
    </select>
    <button type="submit">Add bug</button>
  </form>
</div>

<form method="get" action="/">
  Filter:
  <select name="status"><option value="">All statuses</option>
    {% for s in statuses %}<option>{{ s }}</option>{% endfor %}
  </select>
  <select name="severity"><option value="">All severities</option>
    {% for s in severities %}<option>{{ s }}</option>{% endfor %}
  </select>
  <button type="submit">Apply</button>
</form>

<table>
  <tr><th>ID</th><th>Title</th><th>Severity</th><th>Status</th><th>Action</th></tr>
  {% for bug in bugs %}
  <tr>
    <td>{{ bug.id }}</td><td>{{ bug.title }}</td><td>{{ bug.severity }}</td><td>{{ bug.status }}</td>
    <td><form method="post" action="/delete/{{ bug.id }}"><button type="submit">Delete</button></form></td>
  </tr>
  {% else %}
  <tr><td colspan="5">No bugs found.</td></tr>
  {% endfor %}
</table>
{% endblock %}
